<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alejandro Brito — Full-Stack Engineer, IA en producción">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#2563EB" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#111C2E" stroke-width="1" fill="none"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <clipPath id="type1"><rect x="94" y="190" height="36" width="0">
      <animate attributeName="width" values="0;552;552;0;0" keyTimes="0;0.141;0.326;0.333;1" dur="13.5s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="94" y="190" height="36" width="0">
      <animate attributeName="width" values="0;0;597;597;0;0" keyTimes="0;0.333;0.474;0.659;0.667;1" dur="13.5s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="94" y="190" height="36" width="0">
      <animate attributeName="width" values="0;0;622;622;0" keyTimes="0;0.667;0.807;0.993;1" dur="13.5s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0A0D14"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <circle cx="1020" cy="40" r="260" fill="url(#glow1)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 40; 0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="300" r="230" fill="url(#glow2)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 -30; 0 0" dur="19s" repeatCount="indefinite"/>
    </circle>

    <!-- orbital decoration -->
    <g stroke="#1B2A44" stroke-width="1" fill="none">
      <circle cx="1010" cy="160" r="58"/>
      <circle cx="1010" cy="160" r="94"/>
      <circle cx="1010" cy="160" r="130"/>
    </g>
    <g>
      <circle cx="1104" cy="160" r="5" fill="#3B82F6"/>
      <circle cx="1104" cy="160" r="9" fill="#3B82F6" opacity="0.25"/>
      <animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="1068" cy="160" r="3.5" fill="#38BDF8"/>
      <animateTransform attributeName="transform" type="rotate" from="360 1010 160" to="0 1010 160" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="880" cy="160" r="2.5" fill="#93C5FD" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="22s" repeatCount="indefinite"/>
    </g>

    <!-- plus marks -->
    <g stroke="#23406B" stroke-width="1.5" opacity="0.7">
      <path d="M765 84h12M771 78v12"/>
      <path d="M842 246h12M848 240v12"/>
      <path d="M700 122h10M705 117v10"/>
    </g>

    <!-- terminal bar -->
    <rect width="1200" height="52" fill="#0C1220"/>
    <line x1="0" y1="52" x2="1200" y2="52" stroke="#16233B"/>
    <circle cx="30" cy="26" r="7" fill="#FF5F57"/>
    <circle cx="54" cy="26" r="7" fill="#FEBC2E"/>
    <circle cx="78" cy="26" r="7" fill="#28C840"/>
    <text x="104" y="31" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#526581">alejandro@panama : ~/software-en-produccion</text>
    <text x="1170" y="31" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#31415C">— bash</text>

    <!-- top shimmer line -->
    <g>
      <rect x="0" y="0" width="280" height="3" fill="url(#shimmer)">
        <animate attributeName="x" values="-280;1200" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- name -->
    <text x="66" y="146" font-family="'Segoe UI', -apple-system, Ubuntu, Roboto, sans-serif" font-size="62" font-weight="700" letter-spacing="-1">
      <tspan fill="#F1F5F9">Alejandro </tspan><tspan fill="url(#accent)">Brito</tspan>
    </text>
    <rect x="68" y="162" width="140" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="140;92;140" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- typed line -->
    <text x="68" y="215" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#3B82F6">$</text>
    <g clip-path="url(#type1)">
      <text x="96" y="215" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="21" fill="#CBD5E1" textLength="540" lengthAdjust="spacing">Full-Stack Engineer — IA aplicada en producción</text>
    </g>
    <g clip-path="url(#type2)">
      <text x="96" y="215" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="21" fill="#CBD5E1" textLength="585" lengthAdjust="spacing">Agentes de IA · RAG · LLMOps · 52 repos open source</text>
    </g>
    <g clip-path="url(#type3)">
      <text x="96" y="215" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="21" fill="#CBD5E1" textLength="610" lengthAdjust="spacing">SaaS y ERPs en producción — Morph · Norden · SIMANLLA</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.330;0.331;1" dur="13.5s" repeatCount="indefinite"/>
      <rect x="96" y="195" width="11" height="26" fill="#3B82F6">
        <animate attributeName="x" values="96;640;640;96;96" keyTimes="0;0.141;0.326;0.333;1" dur="13.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.45;0.5;0.95;0.951;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.332;0.333;0.664;0.665;1" dur="13.5s" repeatCount="indefinite"/>
      <rect x="96" y="195" width="11" height="26" fill="#3B82F6">
        <animate attributeName="x" values="96;96;685;685;96;96" keyTimes="0;0.333;0.474;0.659;0.667;1" dur="13.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.45;0.5;0.95;0.951;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.666;0.667;1" dur="13.5s" repeatCount="indefinite"/>
      <rect x="96" y="195" width="11" height="26" fill="#3B82F6">
        <animate attributeName="x" values="96;96;710;710;96" keyTimes="0;0.667;0.807;0.993;1" dur="13.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.45;0.5;0.95;0.951;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- bottom row -->
    <text x="68" y="268" font-family="'Segoe UI', -apple-system, Ubuntu, Roboto, sans-serif" font-size="15" fill="#64748B">📍 Ciudad de Panamá</text>
    <circle cx="256" cy="263" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="268" y="268" font-family="'Segoe UI', -apple-system, Ubuntu, Roboto, sans-serif" font-size="15" fill="#64748B">construyendo: Morph · Norden · SIMANLLA</text>
    <text x="1134" y="268" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="15" fill="#60A5FA">alejandrobrito.dev</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" stroke="#1E293B"/>
</svg>

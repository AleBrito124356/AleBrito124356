name: generate-snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#2563EB&color_dots=#EAEEF2,#BFD6F6,#8DBDFF,#4B91F1,#2563EB
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3B82F6&color_dots=#10151F,#1E3A8A,#2563EB,#3B82F6,#93C5FD

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
